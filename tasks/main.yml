---
- name: Gather facts when the play did not
  ansible.builtin.setup:
  when: ansible_facts.os_family is not defined
  tags: [always]

# ==============================================================================
# 1. FAIL FAST - validate input before touching anything
# ==============================================================================

- name: Validate the role input
  ansible.builtin.import_tasks:
    file: validate.yml
  tags: [always]

# ==============================================================================
# 2. TEARDOWN - a separate path, so the rest of the file only handles 'present'
# ==============================================================================

- name: Remove the OpenVPN server instance
  ansible.builtin.include_tasks:
    file: absent.yml
    apply:
      tags: [openvpn]
  when: openvpn_state == 'absent'
  tags: [openvpn]

# ==============================================================================
# 3. DEPLOY
# ==============================================================================

- name: Install OpenVPN
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [openvpn, openvpn_install]
  when: openvpn_state == 'present'
  tags: [openvpn, openvpn_install]

- name: Install the PKI files
  ansible.builtin.include_tasks:
    file: pki.yml
    apply:
      tags: [openvpn, openvpn_pki]
  when: openvpn_state == 'present'
  tags: [openvpn, openvpn_pki]

- name: Configure the OpenVPN server
  ansible.builtin.include_tasks:
    file: config.yml
    apply:
      tags: [openvpn, openvpn_config]
  when: openvpn_state == 'present'
  tags: [openvpn, openvpn_config]

- name: Configure IP forwarding and NAT
  ansible.builtin.include_tasks:
    file: routing.yml
    apply:
      tags: [openvpn, openvpn_routing]
  when: openvpn_state == 'present'
  tags: [openvpn, openvpn_routing]

- name: Start the OpenVPN server
  ansible.builtin.include_tasks:
    file: service.yml
    apply:
      tags: [openvpn, openvpn_service]
  when: openvpn_state == 'present'
  tags: [openvpn, openvpn_service]
