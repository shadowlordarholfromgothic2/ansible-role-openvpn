---
- name: Converge
  hosts: all
  become: true

  vars:
    molecule_pki: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/pki"

    # Both input forms: content (as it would come from Ansible Vault) and
    # files on the controller. prepare.yml created them.
    openvpn_ca_cert: "{{ lookup('ansible.builtin.file', molecule_pki ~ '/ca.crt') }}"
    openvpn_server_cert_src: "{{ molecule_pki }}/server.crt"
    openvpn_server_key: "{{ lookup('ansible.builtin.file', molecule_pki ~ '/server.key') }}"
    openvpn_tls_crypt_key_src: "{{ molecule_pki }}/tls-crypt.key"
    openvpn_crl_src: "{{ molecule_pki }}/crl.pem"

    openvpn_push_routes:
      - 192.168.100.0/24
    openvpn_dns_servers:
      - 10.8.0.1
    openvpn_dns_domain: vpn.test
    openvpn_client_to_client: true
    openvpn_nat_masquerade: true
    openvpn_extra_config:
      - max-clients 10

  tasks:
    # Fully qualified (namespace from meta/main.yml): Molecule and ansible-lint
    # link the repo under this name, whatever the checkout directory is called.
    - name: Run the role under test
      ansible.builtin.import_role:
        name: homelab.openvpn
