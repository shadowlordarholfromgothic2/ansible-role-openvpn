---
# Runs the role in throwaway containers and proves it converges, is
# idempotent and serves a client - and refuses a revoked one.
#
#   pip install -r requirements-dev.txt
#   molecule test

driver:
  name: docker

platforms:
  # Images with systemd as PID 1, so the openvpn-server@ unit runs as it does
  # on a VM. Privileged for /dev/net/tun, sysctl and nftables.
  - name: openvpn-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    command: /lib/systemd/systemd
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: openvpn-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence     # the important one
    - verify
    - destroy
