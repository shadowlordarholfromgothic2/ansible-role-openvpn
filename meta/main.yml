---
galaxy_info:
  # Must match the prefix of every variable in defaults/main.yml
  # (ansible-lint: var-naming[no-role-prefix]).
  role_name: openvpn
  namespace: homelab
  author: Kirill
  description: >-
    Deploys an OpenVPN server from a PKI it is given (CA, server certificate
    and key, tls-crypt key, CRL), with optional IP forwarding and NAT. Creating
    keys and certificates, client profiles and firewall rules is left to other
    tools.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions: [bookworm, trixie]
    - name: Ubuntu
      versions: [jammy, noble]
  galaxy_tags: [openvpn, vpn, networking, security]

# Prefer checking for a prerequisite in tasks/main.yml over pulling in a role
# that installs it.
dependencies: []
